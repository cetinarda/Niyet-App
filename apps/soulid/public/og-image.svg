  <text x="80" y="370" font-family="Cormorant Garamond, serif" font-size="76" font-weight="600" fill="#f4f1ff">yıldızlar sana</text>
  <text x="80" y="450" font-family="Cormorant Garamond, serif" font-size="76" font-weight="600" fill="#f5d061">ne söylüyordu?</text>

