[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  # Gizli tarama İSTİSNASI (anlık bildirim, Eyl 2026): Team ID ve Key ID gizli
  # bilgi DEĞİL, yalnızca kimlik numarası. Team ID Xcode projelerinde
  # (DEVELOPMENT_TEAM) zaten açıkça yazılı; env "secret" işaretlenince Netlify
  # onu apps/hayvan/ios/...pbxproj içinde bulup deploy'u durdurdu. Asıl gizli
  # olan APNS_PRIVATE_KEY taranmaya DEVAM EDER, buraya ekleme.
  SECRETS_SCAN_OMIT_KEYS = "APNS_TEAM_ID,APNS_KEY_ID"
  # google-services.json istemci yapılandırmasıdır (uygulamanın içinde açıkça
  # durur), sır değil; gelişmiş taramanın API anahtarı kalıbına takılmasın.
  SECRETS_SCAN_OMIT_PATHS = "android/app/google-services.json"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."ai-call"]
  timeout = 26

[functions."ai-report"]
  timeout = 26

# Apple/Google'a 2 ayrı çağrı yapabiliyor; varsayılan 10sn yetmeyebilir.
# Kesilirse istemci !r.ok görüp premium'a dokunmaz (fail-safe) ama doğrulama çalışmaz.
[functions."verify-entitlement"]
  timeout = 26

[[headers]]
  for = "/privacy/*"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/terms/*"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/tanitim/*"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://sakin.life"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Sürüm kontrol dosyası: native uygulama (iOS capacitor://localhost, Android
# https://localhost) bunu CROSS-ORIGIN çeker. CORS header'ı olmadan WKWebView/
# WebView fetch'i engelliyor → güncelleme banner'ı HİÇ görünmüyordu. Public,
# hassas olmayan sürüm bilgisi olduğu için "*" yeterli.
[[headers]]
  for = "/latest-ios-version.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Allow embedded apps (sakinhayvan, sakinmitler, humandesign, soulprofile)
# to be loaded as same-origin iframes inside Sakin.
[[headers]]
  for = "/embedded/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

# Serve /embedded/* as static assets — must come BEFORE the SPA fallback
# so Vite's index.html doesn't swallow the embedded app routes.
[[redirects]]
  from = "/embedded/*"
  to = "/embedded/:splat"
  status = 200
  force = false

# Serve /tanitim/* as static HTML
[[redirects]]
  from = "/tanitim/*"
  to = "/tanitim/:splat"
  status = 200
  force = false

# ── BAĞLANMA TESTİ: paylaşılabilir kısa adres ────────────────────────────────
# Test SoulID embed'inin içinde yaşıyor (/embedded/soulid/attachment/) ama
# sosyal medyada paylaşılan adres kısa olmalı: sakin.life/baglanma
#
# NEDEN 301 (rewrite=200 DEĞİL): embed bundle'ı `basePath=/embedded/soulid`
# ile derleniyor. 200 rewrite yapsaydık tarayıcıdaki yol /baglanma kalırdı,
# Next'in istemci router'ı ise basePath bekliyor → yol eşleşmez, hydration ve
# gezinme bozulabilirdi. 301'de tarayıcı gerçekten embed adresine geçer,
# her şey kendi zemininde çalışır. Paylaşılan link yine kısa.
# TR ve EN iki giriş de aynı yere düşer (sayfa dili kendi tespit ediyor).
[[redirects]]
  from = "/baglanma"
  to = "/embedded/soulid/attachment/"
  status = 301
  force = false

[[redirects]]
  from = "/attachment"
  to = "/embedded/soulid/attachment/"
  status = 301
  force = false

# ── KÖK ARTIK TANITIM SAYFASI ────────────────────────────────────────────────
# sakin.life kökü uygulamayı değil, karşılama/tanıtım sayfasını gösterir
# (public/home/index.html). force = true ŞART: Vite kökte gerçek bir
# dist/index.html üretiyor ve Netlify statik dosyayı zorlanmamış redirect'ten
# ÖNCE servis eder — force olmadan bu kural hiç çalışmazdı.
# Not: SPA'nın kendi meta'ları var (index.html), ama link önizlemesi (WhatsApp vb.)
# kökten okunduğu için asıl OG etiketleri home/index.html'de.
[[redirects]]
  from = "/"
  to = "/home/index.html"
  status = 200
  force = true

# Uygulamanın yeni adresi. Kökte gerçek bir dosya olmadığı için force gerekmiyor.
# src/App.jsx içindeki setScreen(), URL karşılığı olmayan ekranlarda web'de
# "/app" yazar (bkz. oradaki not) — yenilemede tanıtıma düşmesin diye.
[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200
  force = false

# SPA yedeği: /gizlilik, /fiyatlandirma gibi uygulama içi rotalar buradan döner.
# /blog/*, /site.css, /og-sakin.png gerçek statik dosya oldukları için bu kurala
# hiç ulaşmadan servis edilir.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
