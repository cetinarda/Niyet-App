name: Mağaza sürüm bekçisi

# App Store / Play Store'da yeni sürüm CANLI olur olmaz
# public/latest-ios-version.json'u günceller ve web deploy dalına gönderir →
# kullanıcılara uygulama içi "yeni sürüm var" banner'ı otomatik çıkar.
#
# Bu bump elle yapılıyordu ve unutuluyordu (1.3.5 + 1.3.6 yayınlandığı hâlde
# dosya 1.3.4'te kaldı, kimsenin güncellemeden haberi olmadı).

on:
  schedule:
    - cron: "0 9 * * *"   # her gün 09:00 UTC (TR 12:00)
  workflow_dispatch: {}   # Actions sekmesinden elle de tetiklenebilir

permissions:
  contents: write

concurrency:
  group: store-version-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Mağazaları sorgula ve gerekiyorsa güncelle
        id: check
        run: |
          node scripts/check-store-versions.mjs
          if git diff --quiet -- public/latest-ios-version.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: main'e commit'le
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW=$(node -e "const d=require('./public/latest-ios-version.json');console.log(d.ios.version+' / '+d.android.version)")
          git add public/latest-ios-version.json
          git commit -m "chore: mağaza sürümü güncellendi (iOS ${NEW%% /*} · Android ${NEW##*/ })

          Otomatik: scripts/check-store-versions.mjs mağazalarda canlı sürümü
          tespit etti. Uygulama içi güncelleme banner'ı bu dosyadan besleniyor."
          git push origin HEAD:main

      # Banner sakin.life'tan okunuyor → web deploy dalına da gitmezse CANLIYA ÇIKMAZ.
      # gdkpd apartılmış bir dal; SADECE bu dosyayı taşıyoruz, başka hiçbir şeye dokunmuyoruz.
      - name: Web deploy dalına (gdkpd) taşı
        if: steps.check.outputs.changed == 'true'
        run: |
          git fetch origin claude/fix-text-overlap-spacing-gdkpd
          git checkout -B web-deploy origin/claude/fix-text-overlap-spacing-gdkpd
          git checkout main -- public/latest-ios-version.json
          if git diff --cached --quiet && git diff --quiet; then
            echo "gdkpd zaten güncel."
            exit 0
          fi
          git add public/latest-ios-version.json
          git commit -m "web: mağaza sürüm bilgisi güncellendi (otomatik)"
          git push origin HEAD:claude/fix-text-overlap-spacing-gdkpd

      - name: Özet
        run: |
          echo "### Mağaza sürüm bekçisi" >> "$GITHUB_STEP_SUMMARY"
          node -e "const d=require('./public/latest-ios-version.json');console.log('- iOS: '+d.ios.version+'\n- Android: '+d.android.version+'\n- Değişiklik: ${{ steps.check.outputs.changed }}')" >> "$GITHUB_STEP_SUMMARY"
