    <script>
    /* Human Design köprüsü: Sakin host'undan gelen ad/tarih/saat/şehir bilgisi
       ile profil seed eder. Bundle'ın chart hesabı city objesinin {name, lat,
       lng, tz, country, dst} alanlarını kullanıyor (tz = standart UTC offset,
       dst = 'tr' | 'eu' | 'us' | 'none' yaz saati profili). Bu yüzden Sakin'in
       düz string birthCity'sini gömülü CITY_DB'den lat/lng/tz/dst objesine
       çeviriyoruz. Sadece şehir CITY_DB'de bulunursa seed edilir; bulunmazsa
       (veya zaten profil varsa) hiç dokunulmaz, uygulamanın kendi onboarding'i
       devreye girer. Aynı zamanda eski hatalı bridge'in (city=string) yazdığı
       bozuk profilleri temizler. */
    (function() {
      try {
        // 1) Bozuk profil temizliği (önceki bridge city'yi string yazıyordu).
        var ex = localStorage.getItem('@tasarim_profiles');
        if (ex) {
          try {
            var list = JSON.parse(ex);
            var broken = Array.isArray(list) && list.some(function(p){
              return p && (typeof p.city === 'string' || !p.city ||
                typeof p.city.lat !== 'number' || typeof p.city.lng !== 'number' ||
                typeof p.city.tz !== 'number');
            });
            if (broken) {
              localStorage.removeItem('@tasarim_profiles');
              localStorage.removeItem('@tasarim_active');
              localStorage.removeItem('@tasarim_onboarded');
              ex = null;
            }
          } catch(e) {
            localStorage.removeItem('@tasarim_profiles');
            localStorage.removeItem('@tasarim_active');
            localStorage.removeItem('@tasarim_onboarded');
            ex = null;
          }
        }

        // 2) Profil zaten varsa dokunma.
        if (ex) return;

        // 3) Host'tan veri al. İsim opsiyonel (HD sadece etiket için kullanır,
        //    chart hesabında yok). Asıl gerekli: tarih + saat + şehir.
        var n = localStorage.getItem('sakin_name') || '';
        var d = localStorage.getItem('sakin_birth_date');
        var t = localStorage.getItem('sakin_birth_time');
        var c = localStorage.getItem('sakin_birth_city');
        if (!d || !t || !c) return; // tarih/saat/şehir yoksa onboarding'e bırak

        // 4) CITY_DB — HD bundle şeması: {name, lat, lng, tz, country, dst}.
        //    Sakin'in 81 il + büyük dünya şehri DB'sinden türetildi.
        //    tz = STANDART UTC offset (DST hariç). DST kuralları:
        //    'tr' = Türkiye (2017+ kalıcı +1), 'eu' = Avrupa (Mart-Ekim +1),
        //    'us' = ABD/Kanada (Mart-Kasım +1), 'none' = DST yok.

        var CITY_DB = {
          // Türkiye 81 il + bazı ilçeler

          'manisa':TR('Manisa, Türkiye',38.61,27.43), 'kahramanmaraş':TR('Kahramanmaraş, Türkiye',37.58,36.93),

          'şırnak':TR('Şırnak, Türkiye',37.52,42.46), 'bartın':TR('Bartın, Türkiye',41.64,32.34),

          'kilis':TR('Kilis, Türkiye',36.72,37.12), 'osmaniye':TR('Osmaniye, Türkiye',37.07,36.25),
          'düzce':TR('Düzce, Türkiye',40.84,31.16), 'develi':TR('Develi, Türkiye',38.39,35.49),
          // Dünya şehirleri (Sakin DB'sinden)
          'london':{name:'Londra, Birleşik Krallık',lat:51.51,lng:-0.13,tz:0,country:'GB',dst:'eu'},
          'londra':{name:'Londra, Birleşik Krallık',lat:51.51,lng:-0.13,tz:0,country:'GB',dst:'eu'},

          'beijing':{name:'Pekin, Çin',lat:39.90,lng:116.41,tz:8,country:'CN',dst:'none'},
          'sydney':{name:'Sydney, Avustralya',lat:-33.87,lng:151.21,tz:10,country:'AU',dst:'none'},
          'tehran':{name:'Tahran, İran',lat:35.69,lng:51.39,tz:3.5,country:'IR',dst:'none'},
          'tahran':{name:'Tahran, İran',lat:35.69,lng:51.39,tz:3.5,country:'IR',dst:'none'},
          'baku':{name:'Bakü, Azerbaycan',lat:40.41,lng:49.87,tz:4,country:'AZ',dst:'none'},
          'bakü':{name:'Bakü, Azerbaycan',lat:40.41,lng:49.87,tz:4,country:'AZ',dst:'none'},
          'lefkoşa':{name:'Lefkoşa, KKTC',lat:35.19,lng:33.36,tz:2,country:'CY',dst:'eu'},
          'nicosia':{name:'Lefkoşa, KKTC',lat:35.19,lng:33.36,tz:2,country:'CY',dst:'eu'}
        };
        function normCity(s){ return (s||'').toLowerCase().trim().replace(/i̇/g,'i').replace(/İ/g,'i'); }
        function lookupCity(input){
          if (!input) return null;
          var q = normCity(input);
          if (CITY_DB[q]) return CITY_DB[q];
          var names = Object.keys(CITY_DB);
          for (var i=0;i<names.length;i++){
            var k = names[i];
            if (q.indexOf(k) !== -1 || k.indexOf(q) !== -1) return CITY_DB[k];
          }
          return null;
        }

        var city = lookupCity(c);
        if (!city) return; // bilinmeyen şehir → onboarding kullanıcıya seçtirir

        // 5) Profil objesi.
        var hh = '12', mm = '00';
        var tp = String(t).split(':');
        if (tp.length >= 2) { hh = String(parseInt(tp[0])||0).padStart(2,'0'); mm = String(parseInt(tp[1])||0).padStart(2,'0'); }

        var id = 'sakin-'+Date.now()+'-'+Math.floor(Math.random()*1e6);
        var profile = {
          id: id,
          name: String(n),
          birthDate: String(d),       // YYYY-MM-DD
          birthTime: hh+':'+mm,       // HH:MM
          city: city,                  // {name, lat, lng, tz, country, dst}
          createdAt: new Date().toISOString()
        };
        localStorage.setItem('@tasarim_profiles', JSON.stringify([profile]));
        localStorage.setItem('@tasarim_active', id);
        localStorage.setItem('@tasarim_onboarded', '1');
      } catch(e) { console.warn('Sakin HD bridge:', e); }
    })();
    </script>
