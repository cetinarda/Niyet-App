<meta name="description" content="Human Design bodygraph ve haftalık kişisel rapor.">
<link rel="icon" href="/embedded/humandesign/favicon.ico" />
    <style>
      /* Sakin embed scroll override — keep an explicit height chain so React Native Web
         ScrollViews can scroll internally. Previous override set html/body/#root height to
         auto which collapsed the flex chain and broke per-screen scrolling on detail views. */
      html, body { overflow: hidden !important; height: 100% !important; min-height: 100% !important; -webkit-overflow-scrolling: touch; }
      #root { height: 100% !important; min-height: 100% !important; display: flex !important; flex: 1 1 auto !important; }
    </style>
    <script>
    /* Sakin Human Design köprüsü — TEMİZLİK katmanı.
       Asıl köprü (host'tan ad/tarih/saat/şehir okuyup profil seed eden ve şehir
       string'ini City objesine çözen mantık) artık BUNDLE içinde: readSakinBridge()
       -> useStore.ts. Burada profil SEED ETMİYORUZ (çift seed olmasın). Bu script
       sadece eski/hatalı bir köprünün yazmış olabileceği BOZUK profilleri (city'si
       string ya da lat/lng/tz eksik) temizler; böylece bundle içi köprü temiz bir
       localStorage üzerinde (list.length === 0) yeniden seed edebilir. */
    (function() {
      try {
        if (typeof localStorage === 'undefined') return;
        var ex = localStorage.getItem('@tasarim_profiles');
        if (!ex) return;
        var broken = false;
        try {
          var list = JSON.parse(ex);
          broken = Array.isArray(list) && list.some(function(p){
            return p && (typeof p.city === 'string' || !p.city ||
              typeof p.city.lat !== 'number' || typeof p.city.lng !== 'number' ||
              typeof p.city.tz !== 'number');
          });
        } catch(e) { broken = true; }
        if (broken) {
          localStorage.removeItem('@tasarim_profiles');
          localStorage.removeItem('@tasarim_active');
          localStorage.removeItem('@tasarim_onboarded');
        }
      } catch(e) { console.warn('Sakin HD bridge cleanup:', e); }
    })();
    </script>
  </head>
