<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />

    <title>Sakin Tasarım</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  <meta name="theme-color" content="#0D0B14">
<meta name="description" content="Human Design bodygraph ve haftalık kişisel rapor.">
<link rel="icon" href="/embedded/humandesign/favicon.ico" />    <style>
      /* Sakin embed scroll override — keep an explicit height chain so React Native Web
         ScrollViews can scroll internally. Previous override set html/body/#root height to
         auto which collapsed the flex chain and broke per-screen scrolling on detail views. */
      html, body { overflow: hidden !important; height: 100% !important; min-height: 100% !important; -webkit-overflow-scrolling: touch; }
      #root { height: 100% !important; min-height: 100% !important; display: flex !important; flex: 1 1 auto !important; }
    </style>
    <script>
    /* Sakin Life bridge: host'tan doğum profilini seed et (tarih + saat + şehir) */
    (function() {
      try {
        var d = localStorage.getItem('sakin_birth_date');
        if (!d) return;                                  // tarih yoksa hiç dokunma
        var ex = localStorage.getItem('@tasarim_profiles');
        var list = ex ? JSON.parse(ex) : [];
        if (Array.isArray(list) && list.length) return;  // zaten profil var → üzerine yazma
        var n = localStorage.getItem('sakin_name') || '';
        var t = localStorage.getItem('sakin_birth_time') || '';
        var c = localStorage.getItem('sakin_birth_city') || '';
        var id = Math.random().toString(36).slice(2, 10);
        var profile = { id: id, name: n, birthDate: d, birthTime: t, city: c, createdAt: new Date().toISOString() };
        localStorage.setItem('@tasarim_profiles', JSON.stringify([profile]));
        localStorage.setItem('@tasarim_active', id);
        localStorage.setItem('@tasarim_onboarded', '1');
      } catch(e) { console.warn('Sakin bridge:', e); }
    })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>
