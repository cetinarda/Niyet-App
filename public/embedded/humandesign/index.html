    <title>Sakin Tasarım</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  <meta name="theme-color" content="#0D0B14">
<meta name="description" content="Human Design bodygraph ve haftalık kişisel rapor.">
<link rel="icon" href="/embedded/humandesign/favicon.ico" />    <style>
      /* Sakin embed scroll override — keep an explicit height chain so React Native Web
         ScrollViews can scroll internally. Previous override set html/body/#root height to
         auto which collapsed the flex chain and broke per-screen scrolling on detail views. */
      html, body { overflow: hidden !important; height: 100% !important; min-height: 100% !important; -webkit-overflow-scrolling: touch; }
      #root { height: 100% !important; min-height: 100% !important; display: flex !important; flex: 1 1 auto !important; }
    </style>
    <script>
    /* Human Design köprüsü KALDIRILDI: bu app'in city alanı {name,lat,lng,tz}
       obje bekliyor; host'tan gelen düz string ile seed etmek bodygraph
       hesabını çökertip beyaz ekrana yol açıyordu. Geocoding gerektiği için
       host doğru city objesini sağlayamaz — uygulamanın kendi onboarding'i
       şehri arar ve koordinata çevirir. Aşağıdaki temizlik, önceki hatalı
       köprünün yazdığı bozuk profili siler ki kullanıcı onboarding'i görsün. */
    (function() {
      try {
        var ex = localStorage.getItem('@tasarim_profiles');
        if (!ex) return;
        var list = JSON.parse(ex);
        // Köprünün yazdığı profil: city bir string (obje değil) → bozuk.
        var broken = Array.isArray(list) && list.some(function(p){ return p && typeof p.city === 'string'; });
        if (broken) {
          localStorage.removeItem('@tasarim_profiles');
          localStorage.removeItem('@tasarim_active');
          localStorage.removeItem('@tasarim_onboarded');
        }
      } catch(e) { /* sessiz geç */ }
    })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
