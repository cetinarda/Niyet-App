    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {

        display: flex;
        height: 100%;
        flex: 1;

    </style>
  <link rel="icon" href="/embedded/sakinhayvan/favicon.ico" />    <style>
      /* Sakin embed scroll override — keep an explicit height chain so React Native Web
         ScrollViews (e.g. animal detail) can scroll internally. The previous override set
         html/body/#root to height:auto which collapsed the flex chain and broke per-screen
         scrolling. */
      html, body { overflow: hidden !important; height: 100% !important; min-height: 100% !important; -webkit-overflow-scrolling: touch; }
      #root { height: 100% !important; min-height: 100% !important; display: flex !important; flex: 1 1 auto !important; }
    </style>
      <script>
    /* Sakin Hayvan köprüsü TEMİZLİK: bu app profili
       {name, element, birthDate, fullName, ...} bekliyor. 'element' alanı
       uygulamanın çok-soruluk kişilik testiyle belirleniyor (ateş/hava/toprak/su)
       — burç/doğum tarihinden türetilmiyor. Element eksik/geçersiz profil animal
       hesabını bozar (null döner). Aşağıdaki temizlik, önceki bir bridge'in yazmış
       olabileceği eksik (element'siz) ya da hatalı tipli profili siler. (Yeni köprü
       artık profili element'siz YAZMIYOR; isim+doğumu onboarding'e ön-dolduruyor,
       element'i kullanıcı seçtikten sonra profil oluşturuluyor.) */
    (function() {
      try {
        var ex = localStorage.getItem('@tura_profile');
        if (!ex) return;
        var p;
        try { p = JSON.parse(ex); }
        catch(e) { localStorage.removeItem('@tura_profile'); return; }
        if (!p || typeof p !== 'object') {
          localStorage.removeItem('@tura_profile'); return;
        }
        // Element zorunlu ve ateş/hava/toprak/su olmalı.
        var validEl = ['ateş','hava','toprak','su'];
        if (!p.element || validEl.indexOf(p.element) === -1) {
          localStorage.removeItem('@tura_profile');
        }
      } catch(e) { /* sessiz geç */ }
    })();
    </script>
  </head>
