    <style>
      /**
       * Extend the react-native-web reset:
       * https://github.com/necolas/react-native-web/blob/master/packages/react-native-web/src/exports/StyleSheet/initialRules.js
       */
      html,
      body,
      #root {
        width: 100%;
        /* To smooth any scrolling behavior */
        -webkit-overflow-scrolling: touch;
        margin: 0px;
        padding: 0px;
        /* Allows content to fill the viewport and go beyond the bottom */
        min-height: 100%;
      }
      #root {
        flex-shrink: 0;
        flex-basis: auto;
        flex-grow: 1;
        display: flex;
        flex: 1;
      }

      html {
        scroll-behavior: smooth;
        /* Prevent text size change on orientation change https://gist.github.com/tfausak/2222823#file-ios-8-web-app-html-L138 */
        -webkit-text-size-adjust: 100%;
        height: calc(100% + env(safe-area-inset-top));
      }

      body {
        display: flex;
        /* Allows you to scroll below the viewport; default value is visible */
        overflow-y: auto;
        overscroll-behavior-y: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -ms-overflow-style: scrollbar;
      }

  <link rel="icon" href="/embedded/sakinhayvan/favicon.ico" />    <style>
      /* Sakin embed scroll override — keep an explicit height chain so React Native Web
         ScrollViews (e.g. animal detail) can scroll internally. The previous override set
         html/body/#root to height:auto which collapsed the flex chain and broke per-screen
         scrolling. */
      html, body { overflow: hidden !important; height: 100% !important; min-height: 100% !important; -webkit-overflow-scrolling: touch; }
      #root { height: 100% !important; min-height: 100% !important; display: flex !important; flex: 1 1 auto !important; }
    </style>
      <script>
    /* Sakin Life köprüsü KALDIRILDI: bu app profili {name, element, birthDate,
       fullName, birthHour, birthMinute, birthCity} bekliyor. 'element' alanı
       uygulamanın kendi onboarding'indeki kişilik/element testiyle belirleniyor
       (ateş/hava/toprak/su) — host bunu sağlayamaz. Eksik 'element' ile seed
       edince profil geçersiz sayılıp uygulama bilgileri tekrar soruyordu.
       Aşağıdaki temizlik, önceki köprünün yazdığı eksik profili siler ki
       kullanıcı uygulamanın kendi akışını sorunsuz görsün. */
    (function() {
      try {
        var ex = localStorage.getItem('@tura_profile');
        if (!ex) return;
        var p = JSON.parse(ex);
        // Köprünün yazdığı profilde 'element' yok → eksik/bozuk.
        if (p && !p.element) localStorage.removeItem('@tura_profile');
      } catch(e) { /* sessiz geç */ }
    })();
    </script>
