<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgC" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0c0a14"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="coreC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,1)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.3)"/>
    </radialGradient>
    <filter id="coreGlowC" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22" result="b1"/>
      <feGaussianBlur stdDeviation="44" in="SourceGraphic" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bgC)"/>
  <g transform="translate(512 512) rotate(45)">
    <rect x="-280" y="-280" width="560" height="560" rx="48"
          fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="5"/>
  </g>
  <g transform="translate(512 512) rotate(45)">
    <rect x="-160" y="-160" width="320" height="320" rx="28"
          fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>
  </g>
  <g filter="url(#coreGlowC)">
    <circle cx="512" cy="512" r="42" fill="url(#coreC)"/>
  </g>
</svg>
