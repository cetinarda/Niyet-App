<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sakin · App Store'a git</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://apps.apple.com/tr/app/sakin-breathing-awareness/id6765619382">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:#0a0612; }
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:32px 24px; text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#efe8ff;
  }
  .mark{
    width:64px; height:64px; margin-bottom:26px; position:relative;
  }
  .mark span{
    position:absolute; inset:0; border:1.5px solid rgba(200,180,235,0.55);
    border-radius:14px; transform:rotate(45deg);
    box-shadow:0 0 16px rgba(184,164,216,0.35);
  }
  .mark i{
    position:absolute; left:50%; top:50%; width:10px; height:10px; border-radius:50%;
    margin:-5px 0 0 -5px;
    background:radial-gradient(circle,rgba(255,255,255,0.95),rgba(220,205,240,0.8));
    box-shadow:0 0 14px rgba(220,200,240,0.7);
  }
  h1{ font-size:19px; font-weight:500; letter-spacing:0.3px; margin:0 0 10px; }
  p{ font-size:14px; line-height:1.6; color:#b0a4c8; margin:0 0 28px; max-width:320px; }
  .btn{
    display:inline-block; padding:14px 34px; border-radius:26px;
    background:linear-gradient(135deg,rgba(184,164,216,0.85),rgba(122,80,150,0.75));
    color:#fff; text-decoration:none; font-size:15px; font-weight:500; letter-spacing:0.3px;
    box-shadow:0 4px 18px rgba(122,80,150,0.35);
  }
  .hint{ margin-top:22px; font-size:12px; color:#786a94; max-width:280px; line-height:1.6; }
</style>
</head>
<body>
  <div class="mark" aria-hidden="true"><span></span><i></i></div>
  <h1>Sakin'i App Store'da aç</h1>
  <p>Seni App Store'a yönlendiriyoruz. Açılmadıysa aşağıdaki butona dokun.</p>
  <a class="btn" id="storeLink" href="https://apps.apple.com/tr/app/sakin-breathing-awareness/id6765619382">App Store'da Aç</a>
  <p class="hint">Instagram veya başka bir uygulama içinden geldiysen ve buton çalışmazsa, sağ üstteki ⋯ menüsünden "Tarayıcıda aç"ı seç.</p>

  <script>
    // Bazı uygulama-içi tarayıcılar App Store'un ağır sayfasını boş bırakıyor.
    // Bu sayfa hafif ve statik olduğu için daha güvenilir açılıyor; yüklenir
    // yüklenmez otomatik yönlendirme dener, başarısız olursa buton zaten orada.
    (function () {
      var url = document.getElementById("storeLink").href;
      setTimeout(function () {
        try { window.location.replace(url); } catch (e) {}
      }, 450);
    })();
  </script>
</body>
</html>
