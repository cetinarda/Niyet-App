apply plugin: 'com.android.application'

// Release imzalama: android/keystore.properties varsa (gitignore'lı, yerel-only)
// oradan okunur. Yoksa release derlemesi imzasız kalır (Play Console'a
// yüklenemez) ama Studio/CLI hata vermeden çalışmaya devam eder.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasKeystore = keystorePropsFile.exists()
if (hasKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = "app.sakin.life"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sakin.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 1.3.9 / versionCode 12 Play'de CANLI (bkz. public/latest-ios-version.json,
        // otomatik mağaza taraması). Yüklenmiş bir versionCode kalıcı olarak
        // yanar, aynısı ikinci kez kabul edilmez.
        // versionCode 13 Play Console'a yüklenmeye çalışıldı, "sürüm kullanıldı"
        // hatası aldı (henüz yayınlanmamıştı ama numara yanmış): CLAUDE.md kuralı
        // gereği +1 artırıldı, versionName aynı kaldı (henüz yayınlanmadı).
        versionCode 14
        versionName "1.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // GOOGLE PLAY "Uygulama optimizasyonu" UYARISI: kod karartma %2
            // ölçülmüştü (eşik %25), çünkü R8 release'de kapalıydı. Açıldı.
            // Kritik keep kuralları proguard-rules.pro'da; özellikle IAP
            // (cc.fovea + billing) yansımayla yüklendiği için tam korunuyor.
            //
            // ⚠️ GERÇEK CİHAZDA DOĞRULANMADAN YAYINLAMA. R8 yalnızca release
            // derlemesinde çalışır, debug'da bu yolun hiçbiri test edilmez.
            // Sırasıyla denenmeli: satın alma, satın alımları geri yükleme,
            // bildirimler, titreşim, paylaşım, sesli okuma, splash/status bar.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Meta App Events (Facebook SDK) — app install/launch tracking, Meta Ads Manager.
    implementation 'com.facebook.android:facebook-android-sdk:latest.release'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
