apply plugin: 'com.android.application'

// Release imzalama: android/keystore.properties varsa (gitignore'lı, yerel-only)
// oradan okunur. Yoksa release derlemesi imzasız kalır (Play Console'a
// yüklenemez) ama Studio/CLI hata vermeden çalışmaya devam eder.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasKeystore = keystorePropsFile.exists()
if (hasKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = "app.sakin.life"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sakin.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 1.3.9 / versionCode 12 Play'de CANLI (bkz. public/latest-ios-version.json,
        // otomatik mağaza taraması). Yüklenmiş bir versionCode kalıcı olarak
        // yanar, aynısı ikinci kez kabul edilmez.
        // versionCode 14 Play Console'a yüklendi, onaylandı AMA Play Store'dan
        // indirilince AÇILIŞTA ÇÖKTÜ (Facebook SDK + R8, bkz. proguard-rules.pro
        // ve build.gradle facebook-android-sdk satırındaki not). Kullanıcı
        // Play Console'da versionCode 12'ye rollback yaptı. Bu düzeltmeyle
        // birlikte +1 artırıldı, versionName aynı kaldı (henüz yayınlanmadı).
        // ⚠️ BİR SONRAKİ YÜKLEMEDEN ÖNCE GERÇEK CİHAZDA TEST ŞART (14 test
        // edilmeden gönderildi ve bu yüzden çöktü).
        versionCode 15
        versionName "1.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // GOOGLE PLAY "Uygulama optimizasyonu" UYARISI: kod karartma %2
            // ölçülmüştü (eşik %25), çünkü R8 release'de kapalıydı. Açıldı.
            // Kritik keep kuralları proguard-rules.pro'da; özellikle IAP
            // (cc.fovea + billing) yansımayla yüklendiği için tam korunuyor.
            //
            // ⚠️ GERÇEK CİHAZDA DOĞRULANMADAN YAYINLAMA. R8 yalnızca release
            // derlemesinde çalışır, debug'da bu yolun hiçbiri test edilmez.
            // Sırasıyla denenmeli: satın alma, satın alımları geri yükleme,
            // bildirimler, titreşim, paylaşım, sesli okuma, splash/status bar.
            minifyEnabled true
            // shrinkResources KAPATILDI (1.4.0 açılış çökmesinden sonra risk
            // azaltma): Play Console'un ölçtüğü "kod karartma" yüzdesi YALNIZCA
            // minifyEnabled ile ilgili, kaynak kırpma o metriğe katkı vermiyor.
            // Buna karşılık kaynak kırpma, YALNIZCA AndroidManifest meta-data'sı
            // üzerinden referans verilen kaynakları (ör. @string/facebook_app_id,
            // facebook_client_token) "kullanılmıyor" sanıp silebiliyor; Facebook
            // SDK bu değerleri süreç başlarken okuduğu için sonuç anında çökme
            // olur. Fayda (birkaç yüz KB) riske değmez. R8 yolu gerçek cihazda
            // kanıtlandıktan sonra istenirse tekrar açılabilir.
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // İMZA SEÇİMİ:
            //   · keystore.properties VARSA → gerçek release anahtarı (mağaza
            //     yüklemesi bununla yapılır).
            //   · YOKSA → DEBUG anahtarı. Bu, YEREL R8 TESTİ İÇİN ŞART:
            //     imzasız APK telefona KURULAMAZ, dolayısıyla eskiden release
            //     (yani R8'li) sürüm yerelde hiç denenemiyordu; "Run" tuşu
            //     debug derlediği için R8 yolu hiç test edilmemiş oluyordu ve
            //     hatalar ancak Play Store'da ortaya çıkıyordu (1.4.0 böyle
            //     çöktü). Debug anahtarıyla imzalı release APK mağazaya
            //     YÜKLENEMEZ ama cihaza kurulup R8 davranışı doğrulanabilir.
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Meta App Events (Facebook SDK) — app install/launch tracking, Meta Ads Manager.
    // ÖNCEDEN "latest.release" idi: sürüm sabitlenmediği için her build farklı
    // bir SDK sürümü çekebiliyordu (tekrarlanabilirlik yok). 1.4.0/versionCode 14
    // Play Store'da açılışta çöktü; kök neden araştırmasında bu satır ve
    // proguard-rules.pro'daki eksik Facebook keep kuralları en güçlü şüpheli
    // olarak işaretlendi (bkz. proguard-rules.pro Facebook bölümü). Sabitlendi.
    implementation 'com.facebook.android:facebook-android-sdk:18.3.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
