apply plugin: 'com.android.application'

// Release imzalama: android/keystore.properties varsa (gitignore'lı, yerel-only)
// oradan okunur.
//
// ⚠️ SADECE DOSYANIN VARLIĞINA BAKMAK YETMİYOR (yaşandı): keystore.properties
// örnekten kopyalanıp `storeFile` şablon değerinde (…/SENIN_KULLANICI_ADIN/…)
// bırakılmıştı. Dosya "var" sayıldığı için release imzalama devreye giriyor,
// sonra Gradle olmayan keystore'u arayıp `validateSigningRelease` ile
// patlıyordu; yani release (R8'li) sürüm yerelde HİÇ derlenemiyordu.
// Artık keystore DOSYASININ KENDİSİ de diskte aranıyor; yoksa release debug
// anahtarıyla imzalanıp yerelde test edilebilir kalıyor (bkz. buildTypes).
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasKeystore = false
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
    def storePath = keystoreProps['storeFile']
    hasKeystore = storePath != null && file(storePath).exists()
    if (!hasKeystore) {
        logger.warn("UYARI: keystore.properties var ama storeFile bulunamadi (${storePath}). " +
                    "Release DEBUG anahtariyla imzalanacak: cihazda test edilebilir, magazaya YUKLENEMEZ.")
    }
}

android {
    namespace = "app.sakin.life"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sakin.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 1.3.9 / versionCode 12 Play'de CANLI (bkz. public/latest-ios-version.json,
        // otomatik mağaza taraması). Yüklenmiş bir versionCode kalıcı olarak
        // yanar, aynısı ikinci kez kabul edilmez.
        // versionCode 16 ÜRETİMDE SORUNSUZ ÇALIŞIYOR (kullanıcı doğruladı).
        // 17: Play Console optimizasyon geri bildirimi (kaynak kırpma kapalıydı,
        // sınıf yeniden paketleme yoktu). versionName 1.4.0 aynı kalıyor.
        // versionCode 14 ve 15 Play'e yüklendi, İKİSİ DE açılışta çöktü ve
        // rollback gerekti. Kök sebep gerçek cihazdan alınan logcat ile
        // kesinleşti: R8 Capacitor çekirdeğini yeniden adlandırınca
        // @CapacitorPlugin anotasyon zinciri kopuyor, izin sorgusu NPE atıyor
        // (ayrıntı: proguard-rules.pro Capacitor bölümü). Keep kuralları
        // düzeltildi, 16'ya çıkarıldı.
        // ⚠️ YÜKLEMEDEN ÖNCE: release APK'yı cihaza kurup AÇILDIĞINI GÖR.
        // "Android Studio'da Run" YETMEZ, o debug derler ve R8 çalışmaz.
        //   ./gradlew assembleRelease
        //   adb install -r app/build/outputs/apk/release/app-release.apk
        //   (kurulu paket DEBUGGABLE görünüyorsa yanlış sürümü test ediyorsun)
        versionCode 17
        versionName "1.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // GOOGLE PLAY "Uygulama optimizasyonu" UYARISI: kod karartma %2
            // ölçülmüştü (eşik %25), çünkü R8 release'de kapalıydı. Açıldı.
            // Kritik keep kuralları proguard-rules.pro'da; özellikle IAP
            // (cc.fovea + billing) yansımayla yüklendiği için tam korunuyor.
            //
            // ⚠️ GERÇEK CİHAZDA DOĞRULANMADAN YAYINLAMA. R8 yalnızca release
            // derlemesinde çalışır, debug'da bu yolun hiçbiri test edilmez.
            // Sırasıyla denenmeli: satın alma, satın alımları geri yükleme,
            // bildirimler, titreşim, paylaşım, sesli okuma, splash/status bar.
            minifyEnabled true
            // shrinkResources GERİ AÇILDI (versionCode 17). 1.4.0 çökmesinden
            // sonra temkin amaçlı kapatılmıştı; o çökmenin sebebi kaynak kırpma
            // DEĞİL, R8'in Capacitor anotasyon zincirini kırmasıydı (bkz.
            // proguard-rules.pro Capacitor bölümü) ve versionCode 16 gerçek
            // cihazda + üretimde sorunsuz çalışarak bunu kanıtladı.
            // Play Console "Kullanılmayan kaynakları kaldırma etkin değil" diye
            // uyarıyordu, tam olarak bu satır yüzünden.
            // Güvenlik ağı: res/raw/keep.xml kritik kaynakları (Facebook app id
            // ve client token, file_paths) ADIYLA koruyor ve shrinkMode="safe"
            // ile dinamik (getIdentifier) erişimlere temkinli davranılıyor.
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // İMZA SEÇİMİ:
            //   · keystore.properties VARSA → gerçek release anahtarı (mağaza
            //     yüklemesi bununla yapılır).
            //   · YOKSA → DEBUG anahtarı. Bu, YEREL R8 TESTİ İÇİN ŞART:
            //     imzasız APK telefona KURULAMAZ, dolayısıyla eskiden release
            //     (yani R8'li) sürüm yerelde hiç denenemiyordu; "Run" tuşu
            //     debug derlediği için R8 yolu hiç test edilmemiş oluyordu ve
            //     hatalar ancak Play Store'da ortaya çıkıyordu (1.4.0 böyle
            //     çöktü). Debug anahtarıyla imzalı release APK mağazaya
            //     YÜKLENEMEZ ama cihaza kurulup R8 davranışı doğrulanabilir.
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Meta App Events (Facebook SDK) — app install/launch tracking, Meta Ads Manager.
    // ÖNCEDEN "latest.release" idi: sürüm sabitlenmediği için her build farklı
    // bir SDK sürümü çekebiliyordu (tekrarlanabilirlik yok). 1.4.0/versionCode 14
    // Play Store'da açılışta çöktü; kök neden araştırmasında bu satır ve
    // proguard-rules.pro'daki eksik Facebook keep kuralları en güçlü şüpheli
    // olarak işaretlendi (bkz. proguard-rules.pro Facebook bölümü). Sabitlendi.
    implementation 'com.facebook.android:facebook-android-sdk:18.3.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
