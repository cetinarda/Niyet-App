<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#15101e"/>
      <stop offset="100%" stop-color="#080610"/>
    </radialGradient>
    <linearGradient id="outerStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(220,200,240,0.85)"/>
      <stop offset="50%" stop-color="rgba(184,164,216,0.65)"/>
      <stop offset="100%" stop-color="rgba(150,130,190,0.5)"/>
    </linearGradient>
    <linearGradient id="innerStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(200,180,235,0.55)"/>
      <stop offset="100%" stop-color="rgba(160,140,200,0.35)"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,1)"/>
      <stop offset="55%" stop-color="rgba(232,218,250,0.95)"/>
      <stop offset="100%" stop-color="rgba(200,180,235,0.45)"/>
    </radialGradient>
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="coreGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="24" result="b1"/>
      <feGaussianBlur stdDeviation="48" in="SourceGraphic" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Arka plan: derin gece -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Çok hafif kozmik yıldızlar -->
  <g opacity="0.6">
    <circle cx="180" cy="220" r="1.5" fill="#ffffff"/>
    <circle cx="860" cy="180" r="1.2" fill="#ffffff"/>
    <circle cx="120" cy="780" r="1.4" fill="#ffffff"/>
    <circle cx="920" cy="820" r="1.3" fill="#ffffff"/>
    <circle cx="780" cy="380" r="1.0" fill="#ffffff"/>
    <circle cx="260" cy="640" r="1.1" fill="#ffffff"/>
  </g>
  <!-- Dış elmas (rotated 45°) — zarif mor parıltı -->
  <g transform="translate(512 512) rotate(45)" filter="url(#outerGlow)">
    <rect x="-280" y="-280" width="560" height="560" rx="48"
          fill="none" stroke="url(#outerStroke)" stroke-width="6"/>
  </g>
  <!-- İç elmas (rotated -45°, daha küçük) -->
  <g transform="translate(512 512) rotate(-15)">
    <rect x="-160" y="-160" width="320" height="320" rx="28"
          fill="none" stroke="url(#innerStroke)" stroke-width="4"/>
  </g>
  <!-- Merkez ışıklı çekirdek -->
  <g filter="url(#coreGlow)">
    <circle cx="512" cy="512" r="48" fill="url(#core)"/>
  </g>
</svg>
