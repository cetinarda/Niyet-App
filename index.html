<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1.0 ŞART: iOS 16px altı font'lu input'a odaklanınca sayfayı
         otomatik zoom'lar ve SPA'da zoom kalıcı kalır (Tasarım'da ekran büyümesi bug'ı). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <title>Sakin</title>
    <meta name="description" content="Sakinleş ve içindeki sesi dinle. Nefes, meditasyon, frekans, çakra ve sembollerle bütünsel bir farkındalık sistemi." />
    <!-- Open Graph: uygulama kabuğu (SPA) linki paylaşıldığında da önizleme çıksın.
         Tanıtım sayfası ve blog kendi meta'larını taşır (public/home, public/blog);
         burası /app ve URL karşılığı olan ekranlar (/gizlilik, /fiyatlandirma…) içindir.
         og:url bilinçli olarak kök: paylaşımda kullanıcı tanıtım sayfasına insin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sakin" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:url" content="https://sakin.life/" />
    <meta property="og:title" content="Sakin — Sakinleş ve içindeki sesi dinle" />
    <meta property="og:description" content="Gürültülü dünyanın içinde kendine küçük bir alan aç. Nefesini, enerjini, sembollerini ve iç dünyanı keşfet." />
    <meta property="og:image" content="https://sakin.life/og-sakin.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sakin — Sakinleş ve içindeki sesi dinle" />
    <meta name="twitter:description" content="Nefes, meditasyon, frekans, çakra ve sembollerle bütünsel bir farkındalık sistemi." />
    <meta name="twitter:image" content="https://sakin.life/og-sakin.png" />
    <style>
      body { background: #000000; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://assets.lemonsqueezy.com/lemon.js" defer></script>
  </body>
</html>
